ble and no comparison: a count of arrivals in October says nothing about what October would have been","","Promises a cause from data in which nothing was varied on purpose"],"lo":["LO2"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-question","title":"Which rewrite can be answered?"},"level":null,"pool":"checkpoint"},{"id":"check-profile-q1","type":"single","prompt":"320 stays have 999 in the column nights. The data dictionary does not mention the value. What goes into the issue log?","options":[{"key":"A","text":"Set them to missing, record the 320 rows, and ask the register's owner what 999 stands for"},{"key":"B","text":"Replace them with the median length of stay so that no row is lost"},{"key":"C","text":"Keep them: a few very long stays are plausible in a tourism region"},{"key":"D","text":"Delete the 320 rows from the register before any analysis"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The length of those stays is unknown. Missing says so; any other value claims knowledge nobody has. The rows keep their other columns.","misconceptions":["","Hides 320 unknown values inside the most common answer and shrinks the spread","Treats a code as a measurement: the mean of nights would more than triple","Throws away the other nine columns of 320 stays, which are sound"],"lo":["LO3"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-profile","title":"What do you do with the 999s?"},"level":null,"pool":"checkpoint"},{"id":"check-distribution-q1","type":"single","prompt":"Aws Al-Hudaif asks whether visitors from other regions come for one kind of trip or several. You have their 17,367 stays with the nights of each. What do you draw first?","options":[{"key":"A","text":"A box plot of nights for that market"},{"key":"B","text":"A bar with the mean number of nights and an error bar"},{"key":"C","text":"A histogram of nights with bins seven nights wide"},{"key":"D","text":"A histogram of nights with one bin for each night"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"\"One kind or several\" is a question about humps. Only a histogram with bins fine enough to separate them can show two.","misconceptions":["Draws five numbers: two humps and one hump with the same quartiles give the same box","One number for a variable whose shape is the question","Bins of a week merge a weekend trip and a five-night stay into one bar",""],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-distribution","title":"Which chart for which question?"},"level":null,"pool":"checkpoint"},{"id":"check-summary-q1","type":"single","prompt":"A museum records minutes spent inside by each visitor. 45% of the records show 0 minutes because those visitors used only the cafe. The others stay a median of 70 minutes. Which summary is honest?","options":[{"key":"A","text":"Visitors spend a mean of 41 minutes in the museum"},{"key":"B","text":"45% of visitors use only the cafe; the others stay a median of 70 minutes"},{"key":"C","text":"The median visitor spends 25 minutes in the museum"},{"key":"D","text":"Museum visitors stay a median of 70 minutes inside"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A zero-heavy variable holds two groups. Give the share at zero, then a summary of the rest, and the reader can see both.","misconceptions":["Averages cafe users with museum visitors: nobody stays the average time","","The median of all records lands between two groups and describes neither of them","Drops nearly half of the visitors without saying so, which a reader cannot see"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-summary","title":"Which sentence goes into the report?"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"Spend per stay has a mean of 2,736 riyals and a median of 1,498. It is missing for 22% of day visits and 2% of overnight stays. Which sentence is honest?","options":[{"key":"A","text":"A typical party spends about 2,700 riyals in the region"},{"key":"B","text":"Half of the parties that reported spend spent under 1,500 riyals; day visits are under-reported"},{"key":"C","text":"Spend is about 1,500 riyals once missing values are filled in"},{"key":"D","text":"Spend cannot be summarised until the largest stays are removed"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A long tail calls for the median, and a summary carries what was left out and whom it concerns.","misconceptions":["The mean is pulled up by a few very large stays; most parties spend far less than 2,736","","Filling the gaps with the median hides that the missing values sit mostly with day visitors","A long right tail is the normal shape of spend, not an error to delete"],"lo":["LO3"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"Which summary would you send the director?"},"level":null,"pool":"checkpoint"},{"id":"check-two-variables-q1","type":"single","prompt":"A transport authority has 2 million trips, each with distance and fare. An analyst wants to show how fare rises with distance. What should the first chart be?","options":[{"key":"A","text":"A scatter plot of every trip, so that no trip is left out"},{"key":"B","text":"A scatter plot of 200 trips picked at random from the file"},{"key":"C","text":"The correlation of fare and distance, printed as one figure"},{"key":"D","text":"A binned heatmap of the trips, then the median fare by distance band"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"With many points, show density by counting in cells, then answer \"how much\" with a summary inside bins of x.","misconceptions":["Two million opaque points overlap into a solid shape that hides where most trips are","A sample of 200 trips shows a few points and loses the rare long trips entirely","One coefficient gives no picture of the shape, and it changes with the unit chosen",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-two-variables","title":"Which picture, and which number?"},"level":null,"pool":"checkpoint"},{"id":"check-rates-q1","type":"single","prompt":"A city logs 420 pothole reports in District A (300 km of road) and 150 in District B (60 km of road). The mayor asks where the roads are worse. What do you report?","options":[{"key":"A","text":"District B: 2.5 reports per km of road against 1.4 in District A"},{"key":"B","text":"District A: it has almost three times as many reports as B"},{"key":"C","text":"Both: the city has 570 reports on 360 km, or 1.6 per km"},{"key":"D","text":"Neither: reports per resident are needed before any answer"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is about roads, so the count is divided by what could have had a pothole: kilometres of road, with both parts shown.","misconceptions":["","Ranks by count, which follows the length of the road network and not its condition","Adds the two districts together, which answers no question about either of them","Residents report, but the question is about roads, so road length is the fitting denominator"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-rates","title":"Which sentence can be printed?"},"level":null,"pool":"checkpoint"},{"id":"check-time-q1","type":"single","prompt":"A library ran a reading campaign in March 2025. Loans were 9,000 in February 2025, 11,500 in March 2025 and 11,000 in March 2024. Loans grew 3% a year before the campaign. Which statement is supported?","options":[{"key":"A","text":"The campaign raised loans by 28%, from 9,000 to 11,500"},{"key":"B","text":"Loans stood 4.5% above the level expected without a campaign"},{"key":"C","text":"Loans stood about 1.5% above a baseline of 11,330 for March 2025"},{"key":"D","text":"The campaign failed, since loans rose less than in a normal year"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The baseline is the same month a year earlier, grown by the usual 3%: 11,330. The excess is 170 loans, small enough to be within the baseline's own wobble.","misconceptions":["Compares March with February, which mixes the campaign with the usual seasonal rise in March","Uses the same month but forgets that loans were already growing 3% a year","","A single March cannot show a failure; the excess is small and the baseline has its own error"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-time","title":"Compared with what?"},"level":null,"pool":"checkpoint"},{"id":"check-reversal-q1","type":"single","prompt":"A centre's pass rate fell from 82% to 76%. Evening courses always pass less often than day courses, and evening enrolment doubled. What comes before writing \"teaching quality fell\"?","options":[{"key":"A","text":"Wait for one more year of results so that the fall is certain"},{"key":"B","text":"Compare pass rates inside day and evening courses, and the shares of each"},{"key":"C","text":"Recompute the pass rate for day courses only and report that figure"},{"key":"D","text":"Weight the pass rate by enrolment so that large courses count for more"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The groups differ in level and their shares changed: the total may have fallen with both pass rates steady or rising. Look at the parts and at the mix.","misconceptions":["A larger sample narrows the uncertainty of 76%; it cannot separate a change of mix from a change of quality","","Removing the evening courses changes the question and discards the group that grew","The total already is the weighted average; weighting it again by enrolment changes nothing"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-reversal","title":"What do you check first?"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"A report says: \"Branch C has the most late deliveries: 310 this quarter.\" Before the sentence is printed, what has to stand beside 310?","options":[{"key":"A","text":"The average number of late deliveries per branch"},{"key":"B","text":"The number of late deliveries in the quarter before"},{"key":"C","text":"A p-value for the difference between the branches"},{"key":"D","text":"The deliveries Branch C made, so 310 becomes a rate"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A count ranks by size. \"Most late deliveries\" needs its denominator before it can mean \"worst\".","misconceptions":["An average of late deliveries over branches is still a count; it does not allow for the size of Branch C","Last quarter's count shows change in Branch C, not whether it is worse than other branches","A chance check comes after the comparison is right; it cannot repair a count used as a rate",""],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"What does the director need beside this number?"},"level":null,"pool":"checkpoint"},{"id":"check-grammar-q1","type":"single","prompt":"A chart must let a manager compare average waiting time across 12 clinics, and also show roughly how many patients each clinic sees. Which specification serves that?","options":[{"key":"A","text":"Clinic on y, patients on x, waiting time as circle size"},{"key":"B","text":"Clinic on y sorted by wait, waiting time on x, patients as circle size"},{"key":"C","text":"Clinic on y, patients on x, waiting time as colour intensity"},{"key":"D","text":"A pie chart with one slice per clinic, sized by waiting time"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The comparison the reader must make gets position on a common scale; the context gets a weaker channel.","misconceptions":["Area is read far less precisely than position, so the comparison that matters gets the weak channel","","Colour intensity is the least precise channel, and twelve shades cannot be ranked by eye","Twelve slices compare by angle, and the chart has nowhere to put the patients"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-grammar","title":"Which channel for which variable?"},"level":null,"pool":"checkpoint"},{"id":"check-facets-q1","type":"single","prompt":"Weekly sales of 8 product lines are drawn as small multiples. The largest line sells fifty times the smallest. The manager asks: \"Which lines have a December peak?\" Which design answers that?","options":[{"key":"A","text":"A shared y scale, so that all eight panels can be compared"},{"key":"B","text":"A single panel with eight lines, one colour for each line"},{"key":"C","text":"A y scale per panel from zero, with a note that scales differ"},{"key":"D","text":"A y scale per panel, fitted tightly to each line's range"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is about shape, so each panel gets its own scale; from zero, so that a peak keeps its true proportion; with a note, so that heights are not compared across panels.","misconceptions":["On a shared scale the small lines are flat, so their December peak cannot be seen","One panel with eight colours puts the small lines in the bottom pixels and needs a legend","","A scale that does not start at zero exaggerates each peak by a different amount in each panel"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-facets","title":"Shared or free?"},"level":null,"pool":"checkpoint"},{"id":"check-misleading-q1","type":"single","prompt":"A slide shows app downloads \"since launch\" as a line that rises every month, under the title \"Growth is accelerating\". Monthly downloads have in fact been falling for half a year. Which fault is this, and which repair?","options":[{"key":"A","text":"Cut baseline: restart the y axis of the line at zero"},{"key":"B","text":"Picked window: add the months before the launch"},{"key":"C","text":"Two axes: move downloads to a second panel"},{"key":"D","text":"Running total: plot the downloads of each month"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A cumulative line can only rise. \"Is it growing\" is a question about the amount per period, so plot that.","misconceptions":["The axis may well start at zero; a cumulative line misleads whatever its baseline is","The whole period is shown; the trouble is the measure, which cannot go down","There is one axis and one series; nothing is being stretched to match another line",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-misleading","title":"Name the fault"},"level":null,"pool":"checkpoint"},{"id":"check-colour-q1","type":"single","prompt":"A line chart of four regions uses red, green, blue and orange lines and a legend. It will be printed in a bilingual annual report. Which single change helps the most readers?","options":[{"key":"A","text":"Label each line at its end, and give each its own dash pattern"},{"key":"B","text":"Make the four lines thicker so that the colours show better"},{"key":"C","text":"Use four shades of one blue, from light to dark"},{"key":"D","text":"Add the region names to the legend in both languages"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Direct labels and a second channel work in grey print and for readers with a colour-vision deficiency. A legend that depends on colour alone does not.","misconceptions":["","Thicker lines are easier to see and exactly as hard to tell apart by colour","A light-to-dark ramp suggests an order among regions that the data does not have","A longer legend is still decoded by colour, which fails in grey print and for red-green deficiency"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-colour","title":"Which change comes first?"},"level":null,"pool":"checkpoint"},{"id":"review-day-3-q1","type":"single","prompt":"A service desk's monthly response time moved between 41 and 46 minutes over two years. The changes must be visible. Which chart is honest?","options":[{"key":"A","text":"Bars, with the y axis from 40 to 47 minutes"},{"key":"B","text":"Bars, with the y axis from 0 to 50 minutes"},{"key":"C","text":"A line with points, y axis from 40 to 47, range stated in the title"},{"key":"D","text":"A filled area, with the y axis from 40 to 47 minutes"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A point or a line is read by its position, so its axis may start where the data starts if the chart says so. Bars and areas are read from their base.","misconceptions":["A bar is read by its length, so an axis from 40 makes 46 look six times 41","Honest and unreadable: the changes of interest are flattened into a level band","","An area is read from its base like a bar, so it needs zero as much as a bar does"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day-3","title":"Where may this axis start?"},"level":null,"pool":"checkpoint"},{"id":"check-chance-q1","type":"single","prompt":"A school network has test scores of 4,000 pupils in 40 schools. Twenty schools used a new timetable. The analyst wants an interval for the difference in mean score between the two groups of schools. What should be resampled?","options":[{"key":"A","text":"The 4,000 pupils, drawn again with replacement"},{"key":"B","text":"The timetable labels of the pupils, shuffled"},{"key":"C","text":"The 4,000 scores, drawn within each school"},{"key":"D","text":"The 40 schools, drawn again with replacement"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The timetable was applied to schools, so the school is the unit: 40 independent units, not 4,000.","misconceptions":["Pupils in one school share teachers and intake, so treating them as independent makes the interval too narrow","Shuffling labels tests whether a difference exists; it does not give an interval for its size","Resampling scores without their pupils or schools destroys the structure being studied",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-chance","title":"Which procedure, on which unit?"},"level":null,"pool":"checkpoint"},{"id":"check-uncertainty-q1","type":"single","prompt":"Two call centres have mean satisfaction 4.3 (interval 4.1 to 4.5, n = 80) and 4.1 (interval 4.0 to 4.2, n = 600). The intervals overlap. Which statement is supported?","options":[{"key":"A","text":"The two centres deliver the same level of satisfaction"},{"key":"B","text":"This sample cannot rank them; the difference needs its own interval"},{"key":"C","text":"The first centre is better, since its mean is higher"},{"key":"D","text":"The second centre is better, since its interval is narrower"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Overlapping intervals leave the order open. A claim about two groups rests on the interval of their difference.","misconceptions":["Overlap shows the sample cannot order the two centres; it does not show that they are equal","","The higher mean rests on 80 responses and its interval reaches down to 4.1","A narrower interval reflects a larger sample, not a better or more reliable service"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-uncertainty","title":"What may the report say?"},"level":null,"pool":"checkpoint"},{"id":"check-exploring-q1","type":"single","prompt":"An analyst compares churn between customers who did and did not use each of 40 app features. One feature shows a difference with p = 0.02. The team wants to announce \"Feature X reduces churn\". What should the analyst say?","options":[{"key":"A","text":"It is exploratory: expected among 40 looks; test it once on new customers"},{"key":"B","text":"It is confirmed, because the p-value is well below 0.05"},{"key":"C","text":"It will be confirmed once the test is rerun with more shuffles"},{"key":"D","text":"It should be discarded and left out of the report entirely"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With 40 comparisons, at least one p-value below 0.05 has an 87% chance when nothing is there. The data that suggested the pattern cannot confirm it.","misconceptions":["","A p-value below 0.05 for one comparison out of forty is what chance alone usually delivers","A larger resample makes the same p-value more exact; it does not undo the search across 40 features","A pattern found by searching can be real; the label and a fresh test are the fair response, not silence"],"lo":["LO1"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-exploring","title":"What is this finding worth?"},"level":null,"pool":"checkpoint"},{"id":"check-report-q1","type":"single","prompt":"A colleague sends a notebook and a PDF report. In the notebook, one cell loads cleaned_final_v3.csv from their desktop, and the bootstrap has no seed. Which request comes first?","options":[{"key":"A","text":"Set a seed, so that the intervals stop changing"},{"key":"B","text":"Send the cleaned file along with the notebook"},{"key":"C","text":"List the library versions that were used"},{"key":"D","text":"Start from the raw data, with the cleaning steps as code"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One path from raw data to page comes first: a hand-made intermediate file is a cache with no code behind it. Then the seed, then the versions.","misconceptions":["A seed makes the draws repeatable, but the numbers would still rest on a file nobody else can rebuild","A copy of the cleaned file lets the notebook run and still hides every decision made in cleaning it","Pinned versions help once the path from the raw data exists; they cannot replace it",""],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-report","title":"Will this report rerun?"},"level":null,"pool":"checkpoint"},{"id":"q-plan-01","type":"single","prompt":"A hospital manager writes: \"Are our clinics doing well on waiting?\" The appointments table has one row per appointment, with clinic, booking date, visit date and minutes waited. Which rewrite is ready for an analysis plan?","options":[{"key":"A","text":"Which of our clinics are performing badly on waiting, and which well?"},{"key":"B","text":"Why do some clinics make their patients wait longer than others?"},{"key":"C","text":"How long do patients wait at our clinics before they are seen?"},{"key":"D","text":"What is the median wait per appointment, by clinic, in 2025?"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"It names the unit (an appointment), the variable (minutes waited), the comparison (by clinic) and the period.","misconceptions":["Keeps a judgement word, \"badly\", that has no measure","Asks for a cause, which a table of appointments cannot give","Names a variable and no comparison or unit",""],"lo":["LO2"],"day":1,"session":1,"slide":{"deck":"day1","id":"anatomy-of-a-question","title":"An answerable question names four things"},"level":"apply","pool":"practice"},{"id":"q-plan-02","type":"single","prompt":"A library has a loans table (one row per loan) and a members table (one row per member). An analyst counts the rows of the loans table for 2025 and reports \"18,400 people borrowed a book\". What is wrong?","options":[{"key":"A","text":"A count cannot be reported without a percentage beside it"},{"key":"B","text":"The loans table should have been joined to the members table before counting"},{"key":"C","text":"The count is of loans, so a member with ten loans is counted ten times"},{"key":"D","text":"The year 2025 is too short a period for a count of members"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"One row is one loan. Counting rows counts loans; people need a count of distinct members.","misconceptions":["Confuses a presentation habit with the error, which is the unit","Believes a join fixes the unit; a join alone still leaves one row per loan","","Looks for the fault in the period, not in what a row is"],"lo":["LO2"],"day":1,"session":1,"slide":{"deck":"day1","id":"unit-of-observation","title":"\"Visitors\" is a different thing in every table"},"level":"apply","pool":"practice"},{"id":"q-plan-03","type":"single","prompt":"A plan entry reads: question \"How do complaints differ across branches?\", table \"complaints\", unit \"one complaint\", variables [\"branch\"], comparison \"look at complaints by branch\". Which part fails a plan checklist first?","options":[{"key":"A","text":"The unit, because a single complaint is too small a unit to analyse on its own"},{"key":"B","text":"The comparison, because it does not say what is set against what"},{"key":"C","text":"The question, because it does not end with the name of the branch concerned"},{"key":"D","text":"The table, because complaints need a second table before they can be counted"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A comparison names the two things compared and the measure; \"look at\" names neither, and a rate needs its denominator.","misconceptions":["Mistakes a fine-grained unit for a fault; the unit is correct for this table","","Invents a rule about the wording of the question","Counting complaints needs one table; it is the rate that needs a second"],"lo":["LO2"],"day":1,"session":1,"slide":{"deck":"day1","id":"the-plan","title":"The plan is a table, and it passes a checklist"},"level":"analyze","pool":"practice"},{"id":"q-explore-01","type":"single","prompt":"An analyst tabulates average basket value by weekday, by store and by payment method, and notices that card payments on Thursdays are highest. She reports: \"Thursday card payments are the most valuable\". How should the finding be labelled?","options":[{"key":"A","text":"Confirmed, because it was computed from the complete sales table of the year"},{"key":"B","text":"Confirmed, because a difference this large between groups cannot be chance"},{"key":"C","text":"Exploratory, because sales data can never be used to confirm any pattern"},{"key":"D","text":"Exploratory, because the comparison was chosen after looking at many cuts"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The pattern was picked because it stood out among many comparisons; the data that suggested it cannot also confirm it.","misconceptions":["Believes complete data makes a searched pattern confirmed","Takes the size of a gap as proof that it was not selected","Thinks the kind of data decides; it is the order of question and look that decides",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"exploratory-or-confirmatory","title":"Exploring finds questions; confirming answers one fixed in advance"},"level":"understand","pool":"practice"},{"id":"q-explore-02","type":"single","prompt":"A pattern was found by exploring the 2024 survey: members rate evening classes higher. What would make it a confirmed finding?","options":[{"key":"A","text":"Writing it down now and testing it on the 2025 survey, not yet looked at"},{"key":"B","text":"Recomputing it on the 2024 survey with a different software package and seed"},{"key":"C","text":"Finding a second pattern in the 2024 survey that points the same way as this"},{"key":"D","text":"Showing the 2024 chart to three colleagues who all agree with the reading"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A fresh test fixes the comparison first and uses data that played no part in finding the pattern.","misconceptions":["","Confuses reproducing a number with testing a claim","More searching in the same data adds comparisons, not evidence","Agreement about a chart is not a test of what the chart suggests"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"what-the-plan-cannot-do","title":"The plan answers \"what happened\", not \"why\""},"level":"apply","pool":"practice"},{"id":"q-profile-01","type":"single","prompt":"An orders table should have one row per order. It has 52,300 rows and 52,000 distinct order numbers. The 300 repeated order numbers each appear twice, with different delivery dates. What goes into the issue log?","options":[{"key":"A","text":"Record 300 orders with conflicting rows and ask the owner which is right"},{"key":"B","text":"Keep the row with the later delivery date, which is the more recent one"},{"key":"C","text":"Drop the second row of each pair, since they are plainly double entries"},{"key":"D","text":"Average the two delivery dates of each pair and keep one row per order"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Rows that share a key and differ are a conflict, not a copy; choosing between them is the owner's decision.","misconceptions":["","Invents a rule that the later row is right","Treats conflicting rows as exact copies","Creates a delivery date that never existed"],"lo":["LO3"],"day":1,"session":2,"slide":{"deck":"day1","id":"grain-and-key","title":"40,600 rows hold 40,000 stays"},"level":"apply","pool":"practice"},{"id":"q-profile-02","type":"single","prompt":"In a customer survey, income is missing for 7% of respondents overall: 3% of those under 40 and 19% of those over 60. An analyst reports mean income from the rows that have a value. What is the main risk?","options":[{"key":"A","text":"The mean rests on 7% fewer rows, so its standard error is slightly larger"},{"key":"B","text":"The 7% is too small a share to affect any summary"},{"key":"C","text":"The mean cannot be computed while any value is missing"},{"key":"D","text":"The mean describes younger respondents more than all respondents"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The missing values sit with one group, so the rows that remain over-represent the other.","misconceptions":["Sees only the loss of rows, not who is lost","Judges by the overall share and ignores where the missing values are","Confuses a software default with a statistical problem",""],"lo":["LO3"],"day":1,"session":2,"slide":{"deck":"day1","id":"where-missing-sits","title":"The share of missing values matters less than where they sit"},"level":"analyze","pool":"practice"},{"id":"q-profile-03","type":"single","prompt":"A column \"age\" in a membership table has a minimum of 0, a maximum of 120 and a spike of 412 rows at exactly 0. The form allows the field to be skipped. What is the most likely reading, and the first step?","options":[{"key":"A","text":"0 stands for \"not given\"; set those values to missing and record 412 rows"},{"key":"B","text":"The spike is random noise in a large table; smooth it away with a wider bin"},{"key":"C","text":"412 members are infants enrolled by their parents; keep the values as they are"},{"key":"D","text":"0 is a data-entry error for 10; add ten years to those rows and record it"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A spike at a default value in an optional field is a code for missing, not a measurement.","misconceptions":["","Treats a structural spike as sampling noise","Takes a default value for a real age","Replaces one invented value with another"],"lo":["LO3"],"day":1,"session":2,"slide":{"deck":"day1","id":"impossible-values","title":"A code that poses as a number moves every summary"},"level":"apply","pool":"practice"},{"id":"q-dist-01","type":"single","prompt":"Delivery times at a courier have a median of 2 days for city A and for city B, and the same quartiles. In city A nearly all parcels take 1 to 3 days. In city B half take 1 day and half take 3 to 4 days. Which chart shows the difference?","options":[{"key":"A","text":"A box plot of delivery days for each city"},{"key":"B","text":"A pie chart of the share of parcels delivered in each city"},{"key":"C","text":"A bar chart of the median number of delivery days for each city"},{"key":"D","text":"A histogram of delivery days for each city, one bin per day"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Two humps and one hump can share the same five numbers; only the histogram shows the shape.","misconceptions":["A box draws the five numbers, which are equal here","Shows the size of each city, not the delivery times","A single number per city, and the numbers are equal",""],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"what-the-box-hides","title":"The box cannot show two humps"},"level":"analyze","pool":"practice"},{"id":"q-dist-02","type":"single","prompt":"A gym chain compares the visit lengths of 9,000 standard members and 600 premium members with two histograms on the same count axis. The premium histogram is a flat strip along the bottom. What is the repair?","options":[{"key":"A","text":"Replace both histograms with the two group means"},{"key":"B","text":"Remove the standard members so that the premium members can be seen"},{"key":"C","text":"Give each histogram its own count axis and place them side by side"},{"key":"D","text":"Draw each group as shares of its own total, on a common share axis"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Shares put groups of unequal size on the same footing, so the shapes can be compared.","misconceptions":["Throws away the shapes that the question is about","Removes the comparison the chart was drawn for","Makes the shapes visible but invites comparing bar heights across different scales",""],"lo":["LO3"],"day":1,"session":3,"slide":{"deck":"day1","id":"shares-not-counts","title":"To compare groups of unequal size, compare shares"},"level":"apply","pool":"practice"},{"id":"q-summary-01","type":"single","prompt":"House prices in a district have a mean of 1.9 million riyals and a median of 1.2 million. A report says \"the typical house costs 1.9 million\". What should it say?","options":[{"key":"A","text":"No typical price can be given for a skewed variable"},{"key":"B","text":"The typical house costs 1.2 million; a few very expensive houses pull the mean up"},{"key":"C","text":"The typical house costs 1.9 million; the mean uses every house and is more accurate"},{"key":"D","text":"The typical house costs 1.55 million, the midpoint of mean and median"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Half of the houses cost less than the median; with a long right tail most houses cost less than the mean.","misconceptions":["Gives up where the median does the job","","Takes \"uses every value\" for \"describes a typical value\"","Averages two summaries that answer different questions"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"mean-follows-tail","title":"The gap between mean and median is a first reading of the shape"},"level":"apply","pool":"practice"},{"id":"q-summary-02","type":"single","prompt":"Two branches both have a mean rating of 3.5 on a 1 to 5 scale. In branch A nearly everyone gives 3 or 4. In branch B half give 5 and half give 2. Which report lets a manager see the difference?","options":[{"key":"A","text":"The mean rating of each branch, given with two decimals"},{"key":"B","text":"The median rating of each branch"},{"key":"C","text":"The total number of ratings of each branch"},{"key":"D","text":"The share of customers at each score, for each branch"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Shares by score show that branch B has a large dissatisfied group that an average conceals.","misconceptions":["More decimals of the same number show nothing new","One number per branch again; it cannot show a split","Shows how many answered, not what they answered",""],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"scores-need-shares","title":"A score from 1 to 5 is summarised by shares"},"level":"analyze","pool":"practice"},{"id":"q-summary-03","type":"single","prompt":"A caption reads: \"Median spend per visitor: 310 riyals.\" The table behind it has 8,000 visitors, of whom 2,100 gave no spend; most of those were visitors on free school trips. What is missing from the caption?","options":[{"key":"A","text":"The number of visitors the median rests on and who was left out"},{"key":"B","text":"The mean spend as well, so that the reader has both summaries at hand"},{"key":"C","text":"The standard deviation of spend"},{"key":"D","text":"The date on which the table was exported"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A summary carries its number of values and what was excluded; here a quarter of the visitors, of one kind, are not in it.","misconceptions":["","A second summary of the same rows does not reveal the excluded rows","Describes spread among the included rows only","Useful for the record, and it does not tell the reader who is missing"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"summary-carries-n","title":"Every question gets a chart, a summary and two sentences"},"level":"evaluate","pool":"practice"},{"id":"q-two-01","type":"single","prompt":"An analyst joins a table of 9,000 orders to a table of 30 warehouses to add each warehouse's region. The result has 9,640 rows. What should the analyst conclude first?","options":[{"key":"A","text":"The join added the 640 orders that had been missing before"},{"key":"B","text":"Some orders were placed twice and the join has revealed them"},{"key":"C","text":"Some warehouse appears more than once in the warehouse table"},{"key":"D","text":"A join always adds a few rows, so the result can be used as it is"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A join to a table with one row per warehouse cannot add rows. More rows than before means a key is repeated on the other side.","misconceptions":["Reads extra rows as recovered data; a join cannot create orders","Looks for the fault in the orders, which the join did not change","","Treats a changed row count as normal and skips the cheapest check there is"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"one-unit-first","title":"Two tables relate only at one unit of observation"},"level":"apply","pool":"practice"},{"id":"q-two-02","type":"single","prompt":"Across 200 shops on 365 days, daily footfall and daily sales correlate at 0.35. Summed over all shops by week, the two series correlate at 0.80. Which sentence is correct?","options":[{"key":"A","text":"The weekly figure is the true correlation and the daily one is wrong"},{"key":"B","text":"The daily figure is the true correlation, since it uses more rows"},{"key":"C","text":"Both are correct, each for its own unit, and a report names the unit"},{"key":"D","text":"The two figures disagree, so one of the two tables has an error"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Adding up shops and days averages away what is particular to one shop on one day. A correlation belongs to the table it was computed on.","misconceptions":["Believes aggregation reveals a truer value; it answers a different question","Believes more rows make a coefficient more correct","","Expects one coefficient per pair of variables whatever the unit"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"correlation-and-unit","title":"One relation, two units, two correlations"},"level":"analyze","pool":"practice"},{"id":"q-two-03","type":"single","prompt":"A scatter plot of 300,000 deliveries (distance against delivery time) is a solid block. The operations manager asks: \"How much longer does a delivery take at 20 km than at 5 km?\" Which display answers that?","options":[{"key":"A","text":"The same scatter plot drawn with smaller and fainter points"},{"key":"B","text":"A heatmap of the number of deliveries by distance and time"},{"key":"C","text":"The correlation coefficient of distance and delivery time"},{"key":"D","text":"The median delivery time inside bands of distance"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A \"how much\" question about y at given x is answered by a summary of y inside bins of x.","misconceptions":["Transparency shows where points are dense, not a value of y at a given x","A heatmap shows where deliveries are, and leaves the reader to guess the middle","One coefficient says how closely points follow a line, not how many minutes",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"binned-medians","title":"To read \"how much\", summarise y inside bins of x"},"level":"apply","pool":"practice"},{"id":"q-rate-01","type":"single","prompt":"A ministry lists the five schools with the most pupils absent last week. All five are among the largest schools in the country. What does the list show?","options":[{"key":"A","text":"Which schools have the most pupils"},{"key":"B","text":"Which schools have an absence problem"},{"key":"C","text":"That large schools cause more absence"},{"key":"D","text":"That absence was recorded wrongly"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A count of absent pupils follows the number of pupils. Without a rate the list ranks schools by size.","misconceptions":["","Reads a count as a rate","Reads a pattern produced by size as an effect of size","Suspects the recording when the measure is the issue"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"counts-rank-size","title":"A ranking by count is mostly a ranking by size"},"level":"analyze","pool":"practice"},{"id":"q-rate-02","type":"single","prompt":"A bank wants to know at which branch a customer visit most often ends in a complaint. It has complaints per branch, customer visits per branch, staff per branch and accounts per branch. Which rate answers the question?","options":[{"key":"A","text":"Complaints per thousand accounts held at the branch"},{"key":"B","text":"Complaints per thousand customer visits to the branch"},{"key":"C","text":"Complaints per member of staff at the branch"},{"key":"D","text":"Complaints at the branch as a share of all complaints"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The denominator is whoever could have produced the event: here, a customer visit.","misconceptions":["Counts accounts, many of which never visit a branch","","Measures workload per employee, which is a different question","A share of all complaints is the count again, divided by a constant"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"choose-a-denominator","title":"The denominator is whoever could have produced the event"},"level":"apply","pool":"practice"},{"id":"q-rate-03","type":"single","prompt":"A table of complaint rates by clinic and age group shows the highest rate, 40 per thousand, for one clinic's patients over 80: 2 complaints from 50 visits. The publication rule asks for at least 10 complaints and 1,000 visits. What does the analyst do?","options":[{"key":"A","text":"Withhold the cell and mark it as withheld in the table"},{"key":"B","text":"Publish the 2 complaints but not the 50 visits"},{"key":"C","text":"Replace the cell with the clinic's rate for all ages"},{"key":"D","text":"Publish it with a note that the rate is the highest"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two complaints give a rate that one more complaint would move by half, and they may identify the two patients. The cell is held back and marked.","misconceptions":["","Publishes the part that could identify people and hides the denominator","Puts a different number in the cell without saying so","Highlights exactly the number that rests on the fewest cases"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"small-cells","title":"Cut finer and the highest rates rest on the fewest cases"},"level":"evaluate","pool":"practice"},{"id":"q-time-01","type":"single","prompt":"A shop ran a sale in June 2024 and again in June 2025. June 2025 sales were 3% above June 2024, in line with the usual yearly growth. A manager says the 2025 sale had no effect. What is wrong with that?","options":[{"key":"A","text":"Nothing: growth of 3% is what a month without a sale shows"},{"key":"B","text":"The comparison month also had a sale, so the effect cancels"},{"key":"C","text":"June should have been compared with May of the same year"},{"key":"D","text":"A single month is too short to compute any growth figure"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A change on a year earlier measures the difference between two years. An event present in both disappears from it.","misconceptions":["Forgets that the reference month was itself a sale month","","Compares with the month before, which mixes the sale with the season","Rejects the comparison for its length when its reference is the issue"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"year-on-year","title":"The same month a year earlier removes the season, and hides what repeats"},"level":"analyze","pool":"practice"},{"id":"q-time-02","type":"single","prompt":"Visits to a park were 20,000 in April 2024, a month without events. Visits usually grow 5% a year. A festival took place in April 2025 and visits were 26,250. By how much did April 2025 exceed its baseline?","options":[{"key":"A","text":"By 5%, the usual growth from one year to the next"},{"key":"B","text":"By 20%, since 5,250 extra visits is a fifth of 26,250"},{"key":"C","text":"By 25%, since the baseline for April 2025 is 21,000"},{"key":"D","text":"By 31%, since 26,250 is 31% more than 20,000"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The baseline is the same month a year earlier grown by the usual 5%: 21,000. And 26,250 divided by 21,000 is 1.25.","misconceptions":["Gives the trend, not the excess over it","Divides the excess by the actual value, not by the baseline","","Credits the festival with the usual yearly growth as well"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"seasonal-baseline","title":"A baseline is what the month would have been: season times trend"},"level":"apply","pool":"practice"},{"id":"q-time-03","type":"single","prompt":"A monthly series of electricity use shows a peak every August, each a little higher than the last, and one tall spike in a February. Which reading names the three parts correctly?","options":[{"key":"A","text":"The August peaks are events, the rise is the season, the spike is the trend"},{"key":"B","text":"The August peaks are the trend, the rise is an event, the spike is the season"},{"key":"C","text":"The August peaks are the season, the rise is the trend, the spike is an event"},{"key":"D","text":"All three are the season, since each one recurs or could recur"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"What repeats at the same time each year is the season, the slow change of level is the trend, and what stands outside both is an event.","misconceptions":["Calls a yearly repeat an event","Calls a yearly repeat a trend","","Folds everything into the season and loses the question"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"trend-season-event","title":"A monthly line holds three things at once"},"level":"understand","pool":"practice"},{"id":"q-mix-01","type":"single","prompt":"A hospital's average length of stay rose from 4.0 to 4.6 days in a year. In both of its wards, surgical and medical, the average stay fell. How can both be true?","options":[{"key":"A","text":"A larger share of patients was in the ward with longer stays"},{"key":"B","text":"Average stays cannot be compared between two different years"},{"key":"C","text":"The hospital average is the plain mean of the two ward averages"},{"key":"D","text":"One of the two ward averages must have been miscalculated"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The hospital average is a weighted average of the wards. It can rise while both ward averages fall if the mix moves to the ward with longer stays.","misconceptions":["","Gives up the comparison; it only needs the mix to be stated","Forgets the weights: a plain mean of two falling numbers would fall","Assumes an arithmetic error where there is a change of weights"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"weighted-average","title":"A total is a weighted average: the weights are the mix"},"level":"analyze","pool":"practice"},{"id":"q-mix-02","type":"single","prompt":"In 2024 a service had 80% routine cases (score 4.5) and 20% complex cases (score 3.5). In 2025 the scores were 4.6 and 3.6, and the mix was 50% routine, 50% complex. What was the 2025 score at the 2024 mix?","options":[{"key":"A","text":"4.10, the average of 4.6 and 3.6 with equal weights"},{"key":"B","text":"4.30, the score of 2024 carried over unchanged"},{"key":"C","text":"4.40, from 0.8 times 4.6 plus 0.2 times 3.6"},{"key":"D","text":"4.60, the score of the larger group in 2024"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Hold the weights at 80% and 20% and use the 2025 scores: 3.68 + 0.72 = 4.40, up from 4.30, while the score as surveyed fell to 4.10.","misconceptions":["Uses the 2025 mix, which gives the figure as surveyed","Uses the 2024 scores as well as the 2024 mix","","Takes one group for the whole"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"fixed-mix","title":"Hold the mix fixed, and the comparison answers one question"},"level":"apply","pool":"practice"},{"id":"q-mix-03","type":"single","prompt":"A regional director sees that the overall pass rate fell while it rose in every course type, because more people now take the harder courses. She asks which number to put in the annual report. What is the best advice?","options":[{"key":"A","text":"Only the overall rate, since it is the official figure"},{"key":"B","text":"Neither, since the two results contradict each other"},{"key":"C","text":"Only the rates by course type, since the overall rate misleads"},{"key":"D","text":"The overall rate, the rates by type and the change of mix, together"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each figure answers a different question. Printed together with the change of mix, they explain each other.","misconceptions":["Leaves the reader to conclude that teaching got worse","Treats two correct tables as an error","Hides a true and relevant fact about the average learner",""],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"which-answer","title":"The total and the fixed-mix figure answer different questions"},"level":"evaluate","pool":"practice"},{"id":"q-grammar-01","type":"single","prompt":"A chart shows one circle per city: population on x, average rent on y, and the circle's colour gives the region. In the terms of a grammar of graphics, what is \"region to colour\"?","options":[{"key":"A","text":"The colour scale"},{"key":"B","text":"An encoding"},{"key":"C","text":"The mark used"},{"key":"D","text":"A facet variable"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An encoding maps a column to a visual channel. The mark is the circle; the scale decides which colour each region gets.","misconceptions":["The scale turns values into colours once the mapping exists","","The mark is the shape drawn for each row, here a circle","A facet would split the regions into separate panels"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"chart-as-specification","title":"Every chart is four decisions"},"level":"understand","pool":"practice"},{"id":"q-grammar-02","type":"single","prompt":"A report must let readers compare the budgets of 15 departments as precisely as possible. Which encoding of the budget serves that best?","options":[{"key":"A","text":"The area of a circle for each department"},{"key":"B","text":"The depth of colour of a tile for each department"},{"key":"C","text":"The position of a point or the end of a bar on one axis"},{"key":"D","text":"The angle of a slice in a pie chart of all departments"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Position on a common scale is read most precisely. Area, angle and colour intensity are read with much larger errors.","misconceptions":["Area is read imprecisely; a reader underestimates large circles","Colour intensity is the least precise channel for a quantity","","Fifteen angles cannot be ranked by eye"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"channels-ranked","title":"Give the most precise channel to the comparison that matters"},"level":"apply","pool":"practice"},{"id":"q-grammar-03","type":"single","prompt":"An analyst draws average exam scores of 6 schools, between 71 and 78, as points on an axis from 70 to 80. A reviewer says: \"The axis must start at zero.\" Who is right?","options":[{"key":"A","text":"The reviewer: every chart of quantities needs a zero baseline"},{"key":"B","text":"The reviewer: without zero the differences are exaggerated"},{"key":"C","text":"The analyst, provided the chart states the range of its axis"},{"key":"D","text":"The analyst: axis ranges are a matter of taste, not accuracy"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A point is read by its position, not by a length from a base. Its axis may start where the data starts, if the chart says so. Bars would need zero.","misconceptions":["Applies the rule for bars and areas to every mark","True for a bar, whose length is read; not for a point","","Right answer for the wrong reason: for bars the range is a matter of accuracy"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"change-one-mark","title":"Change one part and you can say what was gained and lost"},"level":"analyze","pool":"practice"},{"id":"q-facet-01","type":"single","prompt":"Monthly sales of 6 regions are drawn as small multiples. The reader has to see which region sells the most. Which scales fit?","options":[{"key":"A","text":"A separate y scale fitted to each panel"},{"key":"B","text":"One shared y scale for all six panels"},{"key":"C","text":"A separate y scale from zero for each panel"},{"key":"D","text":"A shared x scale and no y axis at all"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Comparing levels across panels needs heights that mean the same thing in every panel: a shared scale.","misconceptions":["Makes every region fill its panel, so all six look the same size","","Keeps proportions inside a panel and still hides which region is largest","Removes the only means of reading a level"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"which-scale-for-which-question","title":"The question chooses the scale"},"level":"apply","pool":"practice"},{"id":"q-facet-02","type":"single","prompt":"A chart with a separate y scale for each of its panels carries no note about the scales. What is the most likely misreading?","options":[{"key":"A","text":"Readers will think the panels show different variables"},{"key":"B","text":"Readers will be unable to see the shape of each series"},{"key":"C","text":"Readers will compare heights across panels as if on one scale"},{"key":"D","text":"Readers will assume that the time axes differ between panels"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"People compare heights across panels by default. With free scales that comparison is false, so the chart has to say that scales differ.","misconceptions":["The panels are labelled; the variable is not in doubt","Free scales are what makes each shape visible","","Nothing suggests different time axes; the y scale is what changed"],"lo":["LO4"],"day":3,"session":2,"slide":{"deck":"day3","id":"free-scales","title":"A scale per panel shows each group's shape"},"level":"analyze","pool":"practice"},{"id":"q-mislead-01","type":"single","prompt":"A bar chart shows customer satisfaction of 88% last year and 91% this year on a y axis from 85% to 92%. This year's bar is twice as tall as last year's. What is the fault and the repair?","options":[{"key":"A","text":"A picked window; show more years on the same axis"},{"key":"B","text":"A count for a rate; divide by the number of customers"},{"key":"C","text":"A cut baseline; start the bars at zero or use points"},{"key":"D","text":"Two axes; plot each year in a panel of its own"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A bar is read by its length. On an axis from 85 the lengths show 3 and 6, not 88 and 91.","misconceptions":["More years would help context and leave the bars as misleading as before","The value is already a rate","","There is one axis and one series"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"fault-cut-baseline","title":"\"Satisfaction collapsed in 2025\""},"level":"analyze","pool":"practice"},{"id":"q-mislead-02","type":"single","prompt":"A slide plots advertising spend on the left axis and sales on the right axis over 24 months. The two lines overlap almost perfectly, and the title says \"Sales follow advertising\". Why is this weak evidence?","options":[{"key":"A","text":"The author chose both axis ranges, and so chose the overlap"},{"key":"B","text":"Lines are the wrong mark for monthly data of this kind"},{"key":"C","text":"Two variables may never be shown on the same chart"},{"key":"D","text":"Sales and spend are in different currencies or units"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"With two free axes, any two series can be made to overlap. A scatter of one against the other shows the relation at its true strength.","misconceptions":["","A line suits a monthly series; the mark is not the issue","Too strong: a scatter plot shows two variables on one chart, honestly","Different units are the reason for two axes, not the reason the overlap misleads"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"fault-two-axes","title":"\"Hotels follow the sites exactly\""},"level":"evaluate","pool":"practice"},{"id":"q-mislead-03","type":"single","prompt":"A headline reads \"Road accidents down 30%\". The chart beside it compares last August with this August. Five years of monthly data exist, and last August included a week of floods. Which fault is this?","options":[{"key":"A","text":"A picked window"},{"key":"B","text":"A running total"},{"key":"C","text":"Uneven steps"},{"key":"D","text":"A cut baseline"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two months were chosen out of sixty, one of them unusual. The repair is the whole series with the flood month named.","misconceptions":["","Nothing is cumulated here","Both periods are one month long","Nothing is said about where the axis starts"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"fault-picked-window","title":"\"Arrivals up 37% in a year\""},"level":"analyze","pool":"practice"},{"id":"q-mislead-04","type":"single","prompt":"After repairing a misleading chart, an analyst wants to know whether the repair mattered. Which test tells her?","options":[{"key":"A","text":"Whether the numbers in the two charts are exactly the same"},{"key":"B","text":"Whether the repaired chart looks more professional than the original"},{"key":"C","text":"Whether the repaired chart uses fewer colours and less ink"},{"key":"D","text":"Whether a reader would conclude something different from the two charts"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A fault matters when the published chart makes a reader believe something the data does not say. Write both conclusions and compare them.","misconceptions":["The numbers are usually the same; the impression is what changed","Polish is not the measure of honesty","Economy of ink is a style rule, not a test of what is concluded",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"before-you-publish","title":"Five questions before a chart goes out"},"level":"evaluate","pool":"practice"},{"id":"q-colour-01","type":"single","prompt":"A map-like grid shows the complaint rate of 40 districts, from low to high. Which kind of palette fits?","options":[{"key":"A","text":"Forty distinct hues, one for each district"},{"key":"B","text":"A rainbow from red through green to violet"},{"key":"C","text":"Two hues, red for bad and green for good"},{"key":"D","text":"One hue running from light to dark"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A quantity from low to high takes a sequential palette: one hue, light to dark.","misconceptions":["Hues tell names apart and cannot order a quantity","A rainbow shows bands where the data has none","Two hues suit a quantity with a midpoint, and red against green fails many readers",""],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"palette-by-variable","title":"The type of the variable chooses the kind of palette"},"level":"apply","pool":"practice"},{"id":"q-colour-02","type":"single","prompt":"A line chart with five coloured lines will be printed in a black-and-white bulletin. Which change keeps every line identifiable?","options":[{"key":"A","text":"Use five darker colours with higher contrast"},{"key":"B","text":"Move the legend from the right to the bottom"},{"key":"C","text":"Label each line at its end and vary the dash pattern"},{"key":"D","text":"Make all five lines the same thickness"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Direct labels and a second channel carry the identity without colour.","misconceptions":["Darker colours become similar greys in print","A legend keyed by colour is useless in grey, wherever it sits","","Equal thickness removes a possible cue and adds none"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"second-channel","title":"Colour is never the only carrier"},"level":"apply","pool":"practice"},{"id":"q-colour-03","type":"single","prompt":"A team produces every chart in Arabic and in English by copying the English notebook and translating the labels by hand. Three months later the two versions of one chart show different numbers. What would have prevented it?","options":[{"key":"A","text":"A second analyst who checks each translated chart before it is released"},{"key":"B","text":"Arabic labels written directly into the data in place of the English ones"},{"key":"C","text":"One function that draws the chart, with the texts read from a label file"},{"key":"D","text":"An image editor used to replace the texts on the exported English chart"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"With one function and one data path, the two versions can differ only in their words.","misconceptions":["Review finds some differences after the fact; it does not remove their cause","Translating the data breaks every join and filter that uses the original values","","Editing an image cuts the chart off from its data altogether"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"arabic-details","title":"In Arabic the words move; the data does not"},"level":"analyze","pool":"practice"},{"id":"q-chance-01","type":"single","prompt":"An analyst has delivery times for two courier firms and wants to know whether the difference of 0.4 day between their means could arise if the firm made no difference. Which procedure fits?","options":[{"key":"A","text":"Repeat the calculation with a different random seed"},{"key":"B","text":"Resample the deliveries of each firm with replacement"},{"key":"C","text":"Sort the deliveries and compare the two medians"},{"key":"D","text":"Shuffle the firm labels and recompute the difference"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Shuffling the labels creates the situation in which the firm makes no difference; the p-value is the share of shuffles with a gap as large as the observed one.","misconceptions":["A seed changes the draws of a procedure; it is not a procedure","Gives an interval for each mean, not a test of \"no difference\"","Changes the summary and gives no measure of chance",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"which-rule","title":"Shuffle to test a difference; resample to put an interval on an estimate"},"level":"apply","pool":"practice"},{"id":"q-chance-02","type":"single","prompt":"A permutation test of a training programme's effect on sales gives p = 0.40 with 30 salespeople in each group. Which sentence may go in the report?","options":[{"key":"A","text":"This data shows no clear effect of the training"},{"key":"B","text":"The training has a 40% chance of working"},{"key":"C","text":"The training has a 60% chance of working"},{"key":"D","text":"The training has no effect on sales"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A large p-value is an absence of evidence for an effect in this data. With 30 per group, a useful effect could easily go unseen.","misconceptions":["","Reads the p-value as the probability of the hypothesis","Reads one minus the p-value as the probability of the hypothesis","Reads absence of evidence as evidence of absence"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"drop-is-not-no-effect","title":"\"Drop\" means \"this data cannot tell\", not \"there is no difference\""},"level":"evaluate","pool":"practice"},{"id":"q-chance-03","type":"single","prompt":"Sensor readings are taken every minute from 12 machines for a week. An analyst bootstraps the 120,000 readings to get an interval for the mean temperature and finds it extremely narrow. Why should it not be trusted?","options":[{"key":"A","text":"A week of readings is too short a period for any bootstrap to work"},{"key":"B","text":"The bootstrap is valid only for normally distributed readings"},{"key":"C","text":"An interval can never be computed for a mean of sensor readings"},{"key":"D","text":"Readings of one machine are alike; the 12 machines are the units"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"There are 12 independent units, not 120,000. Resampling readings as if independent makes the interval far too narrow.","misconceptions":["The length of the period is not what breaks the independence","The bootstrap does not assume a normal distribution","Too strong: the interval is fine once the right unit is resampled",""],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"resample-the-unit","title":"Resample the unit that was sampled: here, the week"},"level":"analyze","pool":"practice"},{"id":"q-uncert-01","type":"single","prompt":"A league table ranks 50 branches by mean customer rating. The top three and the bottom three are all among the smallest branches. What is the most likely reason?","options":[{"key":"A","text":"Small branches give either very good or very bad service"},{"key":"B","text":"Means of small groups vary more, so they reach both ends"},{"key":"C","text":"Customers of small branches rate more carelessly"},{"key":"D","text":"The ranking was computed with the wrong formula"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The fewer the ratings, the more a mean moves by chance. Extremes of a ranking collect small groups for that reason alone.","misconceptions":["Explains by quality what sampling variation already explains","","Invents a behaviour for which there is no evidence","The formula is right; the missing piece is the uncertainty"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"interval-per-site","title":"Every estimate on a chart gets an interval"},"level":"analyze","pool":"practice"},{"id":"q-uncert-02","type":"single","prompt":"Two teams have mean resolution times with 95% intervals of 30 to 38 hours and 35 to 45 hours. An analyst must say whether the teams differ. What is the right next step?","options":[{"key":"A","text":"Compute an interval for the difference between the two means"},{"key":"B","text":"State that they are equal, since the intervals overlap"},{"key":"C","text":"State that they differ, since the means are different"},{"key":"D","text":"Widen both intervals to 99% and compare them again"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Overlap leaves the question open. The interval of the difference answers it directly.","misconceptions":["","Overlap does not prove equality","Ignores the uncertainty of both means","Wider intervals overlap more and still do not address the difference"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"reading-intervals","title":"Overlap does not prove equality: compute the interval of the difference"},"level":"apply","pool":"practice"},{"id":"q-uncert-03","type":"single","prompt":"A chart shows mean satisfaction by service channel with 95% bootstrap intervals. Which sentence belongs in its caption?","options":[{"key":"A","text":"The intervals show that the survey is free of any bias"},{"key":"B","text":"The intervals cover sampling variation, not who chose to answer"},{"key":"C","text":"The intervals prove which channel customers really prefer"},{"key":"D","text":"The intervals contain 95% of all the customers' ratings"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval covers the variation from drawing another sample. It says nothing about non-response or the wording of the question.","misconceptions":["An interval cannot detect or remove bias","","An interval supports a comparison; it does not prove a preference","Confuses an interval for a mean with the spread of the ratings"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"caption-for-uncertainty","title":"The caption names the interval, the sample and the limit"},"level":"evaluate","pool":"practice"},{"id":"q-trap-01","type":"single","prompt":"An analyst tests 20 unrelated survey questions for a difference between two regions, each at the 0.05 level. In truth there is no difference on any of them. About how likely is at least one \"significant\" result?","options":[{"key":"A","text":"About 5%"},{"key":"B","text":"About 20%"},{"key":"C","text":"About 64%"},{"key":"D","text":"About 95%"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"One minus 0.95 to the power 20 is 0.64. With many comparisons, a chance finding is the likely outcome.","misconceptions":["The level of a single test, not of twenty","Guesses a figure near the number of tests","","Confuses the chance of a false alarm with the confidence level"],"lo":["LO1"],"day":4,"session":3,"slide":{"deck":"day4","id":"at-least-one","title":"With 27 comparisons of nothing, a \"finding\" is the likely outcome"},"level":"apply","pool":"practice"},{"id":"q-trap-02","type":"single","prompt":"Which of these findings is confirmed, in the sense used in this course?","options":[{"key":"A","text":"The strongest of 30 correlations found in last year's sales data"},{"key":"B","text":"A result that three analysts each found plausible on inspection"},{"key":"C","text":"A pattern seen in January and seen again by rereading January's data"},{"key":"D","text":"A difference stated in the March plan and tested once on April's data"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"What confirms a finding is the order of events: the question is written down before the data that answers it is looked at.","misconceptions":["Chosen after looking, from many comparisons","Agreement among readers is not a test","The same data cannot suggest a pattern and confirm it",""],"lo":["LO1"],"day":4,"session":3,"slide":{"deck":"day4","id":"exploratory-or-confirmed","title":"What makes a finding confirmed is the order of events"},"level":"analyze","pool":"practice"},{"id":"q-trap-03","type":"single","prompt":"While exploring, an analyst notices that customers who call on Mondays cancel more often. The pattern was one of many she looked at. What should her report say?","options":[{"key":"A","text":"\"Monday callers cancel more often (p = 0.03)\", as a finding"},{"key":"B","text":"\"Exploratory: one of many cuts; to be tested on next quarter's calls\""},{"key":"C","text":"Nothing: exploratory patterns do not belong in a report"},{"key":"D","text":"\"Monday calls cause cancellations; move staff to Mondays\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An exploratory pattern is reported with its label, the search it came from and the test that would confirm it.","misconceptions":["Reports a p-value that ignores the search","","Exploration is where questions come from; hiding it loses the question","Adds a causal claim and a decision to an untested pattern"],"lo":["LO1"],"day":4,"session":3,"slide":{"deck":"day4","id":"from-exploratory-to-confirmed","title":"An exploratory finding is reported with its count and its next test"},"level":"evaluate","pool":"practice"},{"id":"q-trap-04","type":"single","prompt":"An analyst tries the mean, then the median, then the share above a threshold, and reports the one summary for which two groups differ \"significantly\". Why is the reported p-value too optimistic?","options":[{"key":"A","text":"The median is never a valid summary for a test"},{"key":"B","text":"Three summaries were tried and the best one kept"},{"key":"C","text":"The groups should have been merged before testing"},{"key":"D","text":"A threshold always makes a difference look larger"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each choice made after seeing the result is another comparison. The p-value of the one that was kept ignores the others.","misconceptions":["The median is a legitimate summary; the choosing is the issue","","Merging the groups would remove the comparison altogether","Not always, and it misses the point about choosing"],"lo":["LO1"],"day":4,"session":3,"slide":{"deck":"day4","id":"forking-paths","title":"Every choice made after looking is a comparison"},"level":"analyze","pool":"practice"},{"id":"q-report-01","type":"single","prompt":"A report is rendered twice from the same data and code, and one interval reads 0.41 to 0.58 in the first run and 0.40 to 0.59 in the second. What is the most likely cause and its fix?","options":[{"key":"A","text":"Resampling without a fixed seed; set the seed as a parameter"},{"key":"B","text":"Rounding differs between runs; print more decimals"},{"key":"C","text":"The data changed between runs; lock the file"},{"key":"D","text":"The two runs used different computers; use one computer"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A bootstrap draws random resamples. Without a fixed seed, each run draws others, and the ends of the interval move.","misconceptions":["","Rounding is deterministic and gives the same digits each time","The question states that the data was the same","The same seed and versions give the same result on any computer"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"two-renders-differ","title":"Render twice and compare: the first test of any report"},"level":"apply","pool":"practice"},{"id":"q-report-02","type":"single","prompt":"A quarterly report reads its headline numbers from a file \"summary.csv\" that an analyst saved a year ago. Since then, duplicate rows were removed from the raw data. What is the risk?","options":[{"key":"A","text":"The report will run more slowly than it needs to"},{"key":"B","text":"The headline numbers no longer follow from the raw data"},{"key":"C","text":"The summary file may be too large to send by e-mail"},{"key":"D","text":"The report will show more decimals than the raw data has"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A saved summary keeps the numbers of the day it was saved. Later corrections to the data never reach it.","misconceptions":["Speed is the reason caches exist, not their risk","","File size is not the issue","Nothing about decimals follows from caching"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"stale-cache","title":"A cached number is a number with no code behind it"},"level":"analyze","pool":"practice"},{"id":"q-report-03","type":"single","prompt":"A findings table has the columns finding, status, check and limit. Which row is complete and honest?","options":[{"key":"A","text":"\"Discounts cause loyalty\" · confirmed · correlation 0.6 · none needed"},{"key":"B","text":"\"Weekend orders are larger\" · exploratory · best of 14 cuts · test next quarter"},{"key":"C","text":"\"Sales rose in the north\" · confirmed · looked at the chart · none"},{"key":"D","text":"\"Returns fell\" · exploratory · no check was run · the data may be wrong"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It names the status truthfully, gives the check with the search behind it, and states what has to happen next.","misconceptions":["A causal claim resting on a correlation, with the limit refused","","\"Confirmed\" with no plan, no real check and no limit","No check at all, and a limit too vague to act on"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"findings-table","title":"Every finding carries its status, its check and its limit"},"level":"apply","pool":"practice"},{"id":"q-report-04","type":"single","prompt":"An exploratory report for a director who is not an analyst is being edited. Which sentence should stay as it is?","options":[{"key":"A","text":"\"The data proves that evening visitors are more satisfied than others.\""},{"key":"B","text":"\"In this data, evening visitors rated 0.3 point higher (0.1 to 0.5).\""},{"key":"C","text":"\"Satisfaction is driven by the time of day at which people visit.\""},{"key":"D","text":"\"The difference between evening and daytime visitors is significant.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It says what was seen, in which data and how sure, in words the reader understands, and claims no proof and no cause.","misconceptions":["Exploration does not prove","","\"Driven by\" claims a cause that nothing in the data supports","\"Significant\" with no number means \"important\" to this reader"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"writing-for-the-director","title":"An exploratory report says what was seen, how sure, and what is still open"},"level":"evaluate","pool":"practice"},{"id":"q-report-05","type":"single","prompt":"What does it mean for a report to \"rerun\"?","options":[{"key":"A","text":"One command rebuilds every number from the raw data"},{"key":"B","text":"It can be opened again without any software"},{"key":"C","text":"Its charts can be edited by hand after export"},{"key":"D","text":"It was reviewed twice before being sent out"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"One path leads from the read-only raw data to the page, and anyone can run it and get the same page.","misconceptions":["","Being readable is not being reproducible","Hand edits break the path from data to page","Review is useful and is a different thing"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"what-reruns-means","title":"A report that reruns has one path from the raw data to the page"},"level":"understand","pool":"practice"}]}</script>
