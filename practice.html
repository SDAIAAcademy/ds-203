<h2>Day 1: Questions and first looks</h2>
<ol>
<li><p>The director asks: "Did the festivals bring people, or would they have come anyway?" Which rewrite belongs in the plan?</p><ul><li><b>A.</b> Were the festivals successful for the region?</li><li><b>B.</b> How many arrivals were recorded in the festival months?</li><li><b>C.</b> By how much did arrivals in each festival month exceed the baseline for that month of the year?</li><li><b>D.</b> Did the festivals cause visitors to choose Tilal over other regions?</li></ul></li>
<li><p>320 stays have 999 in the column nights. The data dictionary does not mention the value. What goes into the issue log?</p><ul><li><b>A.</b> Set them to missing, record the 320 rows, and ask the register's owner what 999 stands for</li><li><b>B.</b> Replace them with the median length of stay so that no row is lost</li><li><b>C.</b> Keep them: a few very long stays are plausible in a tourism region</li><li><b>D.</b> Delete the 320 rows from the register before any analysis</li></ul></li>
<li><p>Aws Al-Hudaif asks whether visitors from other regions come for one kind of trip or several. You have their 17,367 stays with the nights of each. What do you draw first?</p><ul><li><b>A.</b> A box plot of nights for that market</li><li><b>B.</b> A bar with the mean number of nights and an error bar</li><li><b>C.</b> A histogram of nights with bins seven nights wide</li><li><b>D.</b> A histogram of nights with one bin for each night</li></ul></li>
<li><p>A museum records minutes spent inside by each visitor. 45% of the records show 0 minutes because those visitors used only the cafe. The others stay a median of 70 minutes. Which summary is honest?</p><ul><li><b>A.</b> Visitors spend a mean of 41 minutes in the museum</li><li><b>B.</b> 45% of visitors use only the cafe; the others stay a median of 70 minutes</li><li><b>C.</b> The median visitor spends 25 minutes in the museum</li><li><b>D.</b> Museum visitors stay a median of 70 minutes inside</li></ul></li>
<li><p>A hospital manager writes: "Are our clinics doing well on waiting?" The appointments table has one row per appointment, with clinic, booking date, visit date and minutes waited. Which rewrite is ready for an analysis plan?</p><ul><li><b>A.</b> Which of our clinics are performing badly on waiting, and which well?</li><li><b>B.</b> Why do some clinics make their patients wait longer than others?</li><li><b>C.</b> How long do patients wait at our clinics before they are seen?</li><li><b>D.</b> What is the median wait per appointment, by clinic, in 2025?</li></ul></li>
<li><p>A library has a loans table (one row per loan) and a members table (one row per member). An analyst counts the rows of the loans table for 2025 and reports "18,400 people borrowed a book". What is wrong?</p><ul><li><b>A.</b> A count cannot be reported without a percentage beside it</li><li><b>B.</b> The loans table should have been joined to the members table before counting</li><li><b>C.</b> The count is of loans, so a member with ten loans is counted ten times</li><li><b>D.</b> The year 2025 is too short a period for a count of members</li></ul></li>
<li><p>A plan entry reads: question "How do complaints differ across branches?", table "complaints", unit "one complaint", variables ["branch"], comparison "look at complaints by branch". Which part fails a plan checklist first?</p><ul><li><b>A.</b> The unit, because a single complaint is too small a unit to analyse on its own</li><li><b>B.</b> The comparison, because it does not say what is set against what</li><li><b>C.</b> The question, because it does not end with the name of the branch concerned</li><li><b>D.</b> The table, because complaints need a second table before they can be counted</li></ul></li>
<li><p>An analyst tabulates average basket value by weekday, by store and by payment method, and notices that card payments on Thursdays are highest. She reports: "Thursday card payments are the most valuable". How should the finding be labelled?</p><ul><li><b>A.</b> Confirmed, because it was computed from the complete sales table of the year</li><li><b>B.</b> Confirmed, because a difference this large between groups cannot be chance</li><li><b>C.</b> Exploratory, because sales data can never be used to confirm any pattern</li><li><b>D.</b> Exploratory, because the comparison was chosen after looking at many cuts</li></ul></li>
<li><p>A pattern was found by exploring the 2024 survey: members rate evening classes higher. What would make it a confirmed finding?</p><ul><li><b>A.</b> Writing it down now and testing it on the 2025 survey, not yet looked at</li><li><b>B.</b> Recomputing it on the 2024 survey with a different software package and seed</li><li><b>C.</b> Finding a second pattern in the 2024 survey that points the same way as this</li><li><b>D.</b> Showing the 2024 chart to three colleagues who all agree with the reading</li></ul></li>
<li><p>An orders table should have one row per order. It has 52,300 rows and 52,000 distinct order numbers. The 300 repeated order numbers each appear twice, with different delivery dates. What goes into the issue log?</p><ul><li><b>A.</b> Record 300 orders with conflicting rows and ask the owner which is right</li><li><b>B.</b> Keep the row with the later delivery date, which is the more recent one</li><li><b>C.</b> Drop the second row of each pair, since they are plainly double entries</li><li><b>D.</b> Average the two delivery dates of each pair and keep one row per order</li></ul></li>
<li><p>In a customer survey, income is missing for 7% of respondents overall: 3% of those under 40 and 19% of those over 60. An analyst reports mean income from the rows that have a value. What is the main risk?</p><ul><li><b>A.</b> The mean rests on 7% fewer rows, so its standard error is slightly larger</li><li><b>B.</b> The 7% is too small a share to affect any summary</li><li><b>C.</b> The mean cannot be computed while any value is missing</li><li><b>D.</b> The mean describes younger respondents more than all respondents</li></ul></li>
<li><p>A column "age" in a membership table has a minimum of 0, a maximum of 120 and a spike of 412 rows at exactly 0. The form allows the field to be skipped. What is the most likely reading, and the first step?</p><ul><li><b>A.</b> 0 stands for "not given"; set those values to missing and record 412 rows</li><li><b>B.</b> The spike is random noise in a large table; smooth it away with a wider bin</li><li><b>C.</b> 412 members are infants enrolled by their parents; keep the values as they are</li><li><b>D.</b> 0 is a data-entry error for 10; add ten years to those rows and record it</li></ul></li>
<li><p>Delivery times at a courier have a median of 2 days for city A and for city B, and the same quartiles. In city A nearly all parcels take 1 to 3 days. In city B half take 1 day and half take 3 to 4 days. Which chart shows the difference?</p><ul><li><b>A.</b> A box plot of delivery days for each city</li><li><b>B.</b> A pie chart of the share of parcels delivered in each city</li><li><b>C.</b> A bar chart of the median number of delivery days for each city</li><li><b>D.</b> A histogram of delivery days for each city, one bin per day</li></ul></li>
<li><p>A gym chain compares the visit lengths of 9,000 standard members and 600 premium members with two histograms on the same count axis. The premium histogram is a flat strip along the bottom. What is the repair?</p><ul><li><b>A.</b> Replace both histograms with the two group means</li><li><b>B.</b> Remove the standard members so that the premium members can be seen</li><li><b>C.</b> Give each histogram its own count axis and place them side by side</li><li><b>D.</b> Draw each group as shares of its own total, on a common share axis</li></ul></li>
<li><p>House prices in a district have a mean of 1.9 million riyals and a median of 1.2 million. A report says "the typical house costs 1.9 million". What should it say?</p><ul><li><b>A.</b> No typical price can be given for a skewed variable</li><li><b>B.</b> The typical house costs 1.2 million; a few very expensive houses pull the mean up</li><li><b>C.</b> The typical house costs 1.9 million; the mean uses every house and is more accurate</li><li><b>D.</b> The typical house costs 1.55 million, the midpoint of mean and median</li></ul></li>
<li><p>Two branches both have a mean rating of 3.5 on a 1 to 5 scale. In branch A nearly everyone gives 3 or 4. In branch B half give 5 and half give 2. Which report lets a manager see the difference?</p><ul><li><b>A.</b> The mean rating of each branch, given with two decimals</li><li><b>B.</b> The median rating of each branch</li><li><b>C.</b> The total number of ratings of each branch</li><li><b>D.</b> The share of customers at each score, for each branch</li></ul></li>
<li><p>A caption reads: "Median spend per visitor: 310 riyals." The table behind it has 8,000 visitors, of whom 2,100 gave no spend; most of those were visitors on free school trips. What is missing from the caption?</p><ul><li><b>A.</b> The number of visitors the median rests on and who was left out</li><li><b>B.</b> The mean spend as well, so that the reader has both summaries at hand</li><li><b>C.</b> The standard deviation of spend</li><li><b>D.</b> The date on which the table was exported</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Relationships and time</h2>
<ol>
<li><p>Spend per stay has a mean of 2,736 riyals and a median of 1,498. It is missing for 22% of day visits and 2% of overnight stays. Which sentence is honest?</p><ul><li><b>A.</b> A typical party spends about 2,700 riyals in the region</li><li><b>B.</b> Half of the parties that reported spend spent under 1,500 riyals; day visits are under-reported</li><li><b>C.</b> Spend is about 1,500 riyals once missing values are filled in</li><li><b>D.</b> Spend cannot be summarised until the largest stays are removed</li></ul></li>
<li><p>A transport authority has 2 million trips, each with distance and fare. An analyst wants to show how fare rises with distance. What should the first chart be?</p><ul><li><b>A.</b> A scatter plot of every trip, so that no trip is left out</li><li><b>B.</b> A scatter plot of 200 trips picked at random from the file</li><li><b>C.</b> The correlation of fare and distance, printed as one figure</li><li><b>D.</b> A binned heatmap of the trips, then the median fare by distance band</li></ul></li>
<li><p>A city logs 420 pothole reports in District A (300 km of road) and 150 in District B (60 km of road). The mayor asks where the roads are worse. What do you report?</p><ul><li><b>A.</b> District B: 2.5 reports per km of road against 1.4 in District A</li><li><b>B.</b> District A: it has almost three times as many reports as B</li><li><b>C.</b> Both: the city has 570 reports on 360 km, or 1.6 per km</li><li><b>D.</b> Neither: reports per resident are needed before any answer</li></ul></li>
<li><p>A library ran a reading campaign in March 2025. Loans were 9,000 in February 2025, 11,500 in March 2025 and 11,000 in March 2024. Loans grew 3% a year before the campaign. Which statement is supported?</p><ul><li><b>A.</b> The campaign raised loans by 28%, from 9,000 to 11,500</li><li><b>B.</b> Loans stood 4.5% above the level expected without a campaign</li><li><b>C.</b> Loans stood about 1.5% above a baseline of 11,330 for March 2025</li><li><b>D.</b> The campaign failed, since loans rose less than in a normal year</li></ul></li>
<li><p>A centre's pass rate fell from 82% to 76%. Evening courses always pass less often than day courses, and evening enrolment doubled. What comes before writing "teaching quality fell"?</p><ul><li><b>A.</b> Wait for one more year of results so that the fall is certain</li><li><b>B.</b> Compare pass rates inside day and evening courses, and the shares of each</li><li><b>C.</b> Recompute the pass rate for day courses only and report that figure</li><li><b>D.</b> Weight the pass rate by enrolment so that large courses count for more</li></ul></li>
<li><p>An analyst joins a table of 9,000 orders to a table of 30 warehouses to add each warehouse's region. The result has 9,640 rows. What should the analyst conclude first?</p><ul><li><b>A.</b> The join added the 640 orders that had been missing before</li><li><b>B.</b> Some orders were placed twice and the join has revealed them</li><li><b>C.</b> Some warehouse appears more than once in the warehouse table</li><li><b>D.</b> A join always adds a few rows, so the result can be used as it is</li></ul></li>
<li><p>Across 200 shops on 365 days, daily footfall and daily sales correlate at 0.35. Summed over all shops by week, the two series correlate at 0.80. Which sentence is correct?</p><ul><li><b>A.</b> The weekly figure is the true correlation and the daily one is wrong</li><li><b>B.</b> The daily figure is the true correlation, since it uses more rows</li><li><b>C.</b> Both are correct, each for its own unit, and a report names the unit</li><li><b>D.</b> The two figures disagree, so one of the two tables has an error</li></ul></li>
<li><p>A scatter plot of 300,000 deliveries (distance against delivery time) is a solid block. The operations manager asks: "How much longer does a delivery take at 20 km than at 5 km?" Which display answers that?</p><ul><li><b>A.</b> The same scatter plot drawn with smaller and fainter points</li><li><b>B.</b> A heatmap of the number of deliveries by distance and time</li><li><b>C.</b> The correlation coefficient of distance and delivery time</li><li><b>D.</b> The median delivery time inside bands of distance</li></ul></li>
<li><p>A ministry lists the five schools with the most pupils absent last week. All five are among the largest schools in the country. What does the list show?</p><ul><li><b>A.</b> Which schools have the most pupils</li><li><b>B.</b> Which schools have an absence problem</li><li><b>C.</b> That large schools cause more absence</li><li><b>D.</b> That absence was recorded wrongly</li></ul></li>
<li><p>A bank wants to know at which branch a customer visit most often ends in a complaint. It has complaints per branch, customer visits per branch, staff per branch and accounts per branch. Which rate answers the question?</p><ul><li><b>A.</b> Complaints per thousand accounts held at the branch</li><li><b>B.</b> Complaints per thousand customer visits to the branch</li><li><b>C.</b> Complaints per member of staff at the branch</li><li><b>D.</b> Complaints at the branch as a share of all complaints</li></ul></li>
<li><p>A table of complaint rates by clinic and age group shows the highest rate, 40 per thousand, for one clinic's patients over 80: 2 complaints from 50 visits. The publication rule asks for at least 10 complaints and 1,000 visits. What does the analyst do?</p><ul><li><b>A.</b> Withhold the cell and mark it as withheld in the table</li><li><b>B.</b> Publish the 2 complaints but not the 50 visits</li><li><b>C.</b> Replace the cell with the clinic's rate for all ages</li><li><b>D.</b> Publish it with a note that the rate is the highest</li></ul></li>
<li><p>A shop ran a sale in June 2024 and again in June 2025. June 2025 sales were 3% above June 2024, in line with the usual yearly growth. A manager says the 2025 sale had no effect. What is wrong with that?</p><ul><li><b>A.</b> Nothing: growth of 3% is what a month without a sale shows</li><li><b>B.</b> The comparison month also had a sale, so the effect cancels</li><li><b>C.</b> June should have been compared with May of the same year</li><li><b>D.</b> A single month is too short to compute any growth figure</li></ul></li>
<li><p>Visits to a park were 20,000 in April 2024, a month without events. Visits usually grow 5% a year. A festival took place in April 2025 and visits were 26,250. By how much did April 2025 exceed its baseline?</p><ul><li><b>A.</b> By 5%, the usual growth from one year to the next</li><li><b>B.</b> By 20%, since 5,250 extra visits is a fifth of 26,250</li><li><b>C.</b> By 25%, since the baseline for April 2025 is 21,000</li><li><b>D.</b> By 31%, since 26,250 is 31% more than 20,000</li></ul></li>
<li><p>A monthly series of electricity use shows a peak every August, each a little higher than the last, and one tall spike in a February. Which reading names the three parts correctly?</p><ul><li><b>A.</b> The August peaks are events, the rise is the season, the spike is the trend</li><li><b>B.</b> The August peaks are the trend, the rise is an event, the spike is the season</li><li><b>C.</b> The August peaks are the season, the rise is the trend, the spike is an event</li><li><b>D.</b> All three are the season, since each one recurs or could recur</li></ul></li>
<li><p>A hospital's average length of stay rose from 4.0 to 4.6 days in a year. In both of its wards, surgical and medical, the average stay fell. How can both be true?</p><ul><li><b>A.</b> A larger share of patients was in the ward with longer stays</li><li><b>B.</b> Average stays cannot be compared between two different years</li><li><b>C.</b> The hospital average is the plain mean of the two ward averages</li><li><b>D.</b> One of the two ward averages must have been miscalculated</li></ul></li>
<li><p>In 2024 a service had 80% routine cases (score 4.5) and 20% complex cases (score 3.5). In 2025 the scores were 4.6 and 3.6, and the mix was 50% routine, 50% complex. What was the 2025 score at the 2024 mix?</p><ul><li><b>A.</b> 4.10, the average of 4.6 and 3.6 with equal weights</li><li><b>B.</b> 4.30, the score of 2024 carried over unchanged</li><li><b>C.</b> 4.40, from 0.8 times 4.6 plus 0.2 times 3.6</li><li><b>D.</b> 4.60, the score of the larger group in 2024</li></ul></li>
<li><p>A regional director sees that the overall pass rate fell while it rose in every course type, because more people now take the harder courses. She asks which number to put in the annual report. What is the best advice?</p><ul><li><b>A.</b> Only the overall rate, since it is the official figure</li><li><b>B.</b> Neither, since the two results contradict each other</li><li><b>C.</b> Only the rates by course type, since the overall rate misleads</li><li><b>D.</b> The overall rate, the rates by type and the change of mix, together</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Building honest charts</h2>
<ol>
<li><p>A report says: "Branch C has the most late deliveries: 310 this quarter." Before the sentence is printed, what has to stand beside 310?</p><ul><li><b>A.</b> The average number of late deliveries per branch</li><li><b>B.</b> The number of late deliveries in the quarter before</li><li><b>C.</b> A p-value for the difference between the branches</li><li><b>D.</b> The deliveries Branch C made, so 310 becomes a rate</li></ul></li>
<li><p>A chart must let a manager compare average waiting time across 12 clinics, and also show roughly how many patients each clinic sees. Which specification serves that?</p><ul><li><b>A.</b> Clinic on y, patients on x, waiting time as circle size</li><li><b>B.</b> Clinic on y sorted by wait, waiting time on x, patients as circle size</li><li><b>C.</b> Clinic on y, patients on x, waiting time as colour intensity</li><li><b>D.</b> A pie chart with one slice per clinic, sized by waiting time</li></ul></li>
<li><p>Weekly sales of 8 product lines are drawn as small multiples. The largest line sells fifty times the smallest. The manager asks: "Which lines have a December peak?" Which design answers that?</p><ul><li><b>A.</b> A shared y scale, so that all eight panels can be compared</li><li><b>B.</b> A single panel with eight lines, one colour for each line</li><li><b>C.</b> A y scale per panel from zero, with a note that scales differ</li><li><b>D.</b> A y scale per panel, fitted tightly to each line's range</li></ul></li>
<li><p>A slide shows app downloads "since launch" as a line that rises every month, under the title "Growth is accelerating". Monthly downloads have in fact been falling for half a year. Which fault is this, and which repair?</p><ul><li><b>A.</b> Cut baseline: restart the y axis of the line at zero</li><li><b>B.</b> Picked window: add the months before the launch</li><li><b>C.</b> Two axes: move downloads to a second panel</li><li><b>D.</b> Running total: plot the downloads of each month</li></ul></li>
<li><p>A line chart of four regions uses red, green, blue and orange lines and a legend. It will be printed in a bilingual annual report. Which single change helps the most readers?</p><ul><li><b>A.</b> Label each line at its end, and give each its own dash pattern</li><li><b>B.</b> Make the four lines thicker so that the colours show better</li><li><b>C.</b> Use four shades of one blue, from light to dark</li><li><b>D.</b> Add the region names to the legend in both languages</li></ul></li>
<li><p>A chart shows one circle per city: population on x, average rent on y, and the circle's colour gives the region. In the terms of a grammar of graphics, what is "region to colour"?</p><ul><li><b>A.</b> The colour scale</li><li><b>B.</b> An encoding</li><li><b>C.</b> The mark used</li><li><b>D.</b> A facet variable</li></ul></li>
<li><p>A report must let readers compare the budgets of 15 departments as precisely as possible. Which encoding of the budget serves that best?</p><ul><li><b>A.</b> The area of a circle for each department</li><li><b>B.</b> The depth of colour of a tile for each department</li><li><b>C.</b> The position of a point or the end of a bar on one axis</li><li><b>D.</b> The angle of a slice in a pie chart of all departments</li></ul></li>
<li><p>An analyst draws average exam scores of 6 schools, between 71 and 78, as points on an axis from 70 to 80. A reviewer says: "The axis must start at zero." Who is right?</p><ul><li><b>A.</b> The reviewer: every chart of quantities needs a zero baseline</li><li><b>B.</b> The reviewer: without zero the differences are exaggerated</li><li><b>C.</b> The analyst, provided the chart states the range of its axis</li><li><b>D.</b> The analyst: axis ranges are a matter of taste, not accuracy</li></ul></li>
<li><p>Monthly sales of 6 regions are drawn as small multiples. The reader has to see which region sells the most. Which scales fit?</p><ul><li><b>A.</b> A separate y scale fitted to each panel</li><li><b>B.</b> One shared y scale for all six panels</li><li><b>C.</b> A separate y scale from zero for each panel</li><li><b>D.</b> A shared x scale and no y axis at all</li></ul></li>
<li><p>A chart with a separate y scale for each of its panels carries no note about the scales. What is the most likely misreading?</p><ul><li><b>A.</b> Readers will think the panels show different variables</li><li><b>B.</b> Readers will be unable to see the shape of each series</li><li><b>C.</b> Readers will compare heights across panels as if on one scale</li><li><b>D.</b> Readers will assume that the time axes differ between panels</li></ul></li>
<li><p>A bar chart shows customer satisfaction of 88% last year and 91% this year on a y axis from 85% to 92%. This year's bar is twice as tall as last year's. What is the fault and the repair?</p><ul><li><b>A.</b> A picked window; show more years on the same axis</li><li><b>B.</b> A count for a rate; divide by the number of customers</li><li><b>C.</b> A cut baseline; start the bars at zero or use points</li><li><b>D.</b> Two axes; plot each year in a panel of its own</li></ul></li>
<li><p>A slide plots advertising spend on the left axis and sales on the right axis over 24 months. The two lines overlap almost perfectly, and the title says "Sales follow advertising". Why is this weak evidence?</p><ul><li><b>A.</b> The author chose both axis ranges, and so chose the overlap</li><li><b>B.</b> Lines are the wrong mark for monthly data of this kind</li><li><b>C.</b> Two variables may never be shown on the same chart</li><li><b>D.</b> Sales and spend are in different currencies or units</li></ul></li>
<li><p>A headline reads "Road accidents down 30%". The chart beside it compares last August with this August. Five years of monthly data exist, and last August included a week of floods. Which fault is this?</p><ul><li><b>A.</b> A picked window</li><li><b>B.</b> A running total</li><li><b>C.</b> Uneven steps</li><li><b>D.</b> A cut baseline</li></ul></li>
<li><p>After repairing a misleading chart, an analyst wants to know whether the repair mattered. Which test tells her?</p><ul><li><b>A.</b> Whether the numbers in the two charts are exactly the same</li><li><b>B.</b> Whether the repaired chart looks more professional than the original</li><li><b>C.</b> Whether the repaired chart uses fewer colours and less ink</li><li><b>D.</b> Whether a reader would conclude something different from the two charts</li></ul></li>
<li><p>A map-like grid shows the complaint rate of 40 districts, from low to high. Which kind of palette fits?</p><ul><li><b>A.</b> Forty distinct hues, one for each district</li><li><b>B.</b> A rainbow from red through green to violet</li><li><b>C.</b> Two hues, red for bad and green for good</li><li><b>D.</b> One hue running from light to dark</li></ul></li>
<li><p>A line chart with five coloured lines will be printed in a black-and-white bulletin. Which change keeps every line identifiable?</p><ul><li><b>A.</b> Use five darker colours with higher contrast</li><li><b>B.</b> Move the legend from the right to the bottom</li><li><b>C.</b> Label each line at its end and vary the dash pattern</li><li><b>D.</b> Make all five lines the same thickness</li></ul></li>
<li><p>A team produces every chart in Arabic and in English by copying the English notebook and translating the labels by hand. Three months later the two versions of one chart show different numbers. What would have prevented it?</p><ul><li><b>A.</b> A second analyst who checks each translated chart before it is released</li><li><b>B.</b> Arabic labels written directly into the data in place of the English ones</li><li><b>C.</b> One function that draws the chart, with the texts read from a label file</li><li><b>D.</b> An image editor used to replace the texts on the exported English chart</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Check and report</h2>
<ol>
<li><p>A service desk's monthly response time moved between 41 and 46 minutes over two years. The changes must be visible. Which chart is honest?</p><ul><li><b>A.</b> Bars, with the y axis from 40 to 47 minutes</li><li><b>B.</b> Bars, with the y axis from 0 to 50 minutes</li><li><b>C.</b> A line with points, y axis from 40 to 47, range stated in the title</li><li><b>D.</b> A filled area, with the y axis from 40 to 47 minutes</li></ul></li>
<li><p>A school network has test scores of 4,000 pupils in 40 schools. Twenty schools used a new timetable. The analyst wants an interval for the difference in mean score between the two groups of schools. What should be resampled?</p><ul><li><b>A.</b> The 4,000 pupils, drawn again with replacement</li><li><b>B.</b> The timetable labels of the pupils, shuffled</li><li><b>C.</b> The 4,000 scores, drawn within each school</li><li><b>D.</b> The 40 schools, drawn again with replacement</li></ul></li>
<li><p>Two call centres have mean satisfaction 4.3 (interval 4.1 to 4.5, n = 80) and 4.1 (interval 4.0 to 4.2, n = 600). The intervals overlap. Which statement is supported?</p><ul><li><b>A.</b> The two centres deliver the same level of satisfaction</li><li><b>B.</b> This sample cannot rank them; the difference needs its own interval</li><li><b>C.</b> The first centre is better, since its mean is higher</li><li><b>D.</b> The second centre is better, since its interval is narrower</li></ul></li>
<li><p>An analyst compares churn between customers who did and did not use each of 40 app features. One feature shows a difference with p = 0.02. The team wants to announce "Feature X reduces churn". What should the analyst say?</p><ul><li><b>A.</b> It is exploratory: expected among 40 looks; test it once on new customers</li><li><b>B.</b> It is confirmed, because the p-value is well below 0.05</li><li><b>C.</b> It will be confirmed once the test is rerun with more shuffles</li><li><b>D.</b> It should be discarded and left out of the report entirely</li></ul></li>
<li><p>A colleague sends a notebook and a PDF report. In the notebook, one cell loads cleaned_final_v3.csv from their desktop, and the bootstrap has no seed. Which request comes first?</p><ul><li><b>A.</b> Set a seed, so that the intervals stop changing</li><li><b>B.</b> Send the cleaned file along with the notebook</li><li><b>C.</b> List the library versions that were used</li><li><b>D.</b> Start from the raw data, with the cleaning steps as code</li></ul></li>
<li><p>An analyst has delivery times for two courier firms and wants to know whether the difference of 0.4 day between their means could arise if the firm made no difference. Which procedure fits?</p><ul><li><b>A.</b> Repeat the calculation with a different random seed</li><li><b>B.</b> Resample the deliveries of each firm with replacement</li><li><b>C.</b> Sort the deliveries and compare the two medians</li><li><b>D.</b> Shuffle the firm labels and recompute the difference</li></ul></li>
<li><p>A permutation test of a training programme's effect on sales gives p = 0.40 with 30 salespeople in each group. Which sentence may go in the report?</p><ul><li><b>A.</b> This data shows no clear effect of the training</li><li><b>B.</b> The training has a 40% chance of working</li><li><b>C.</b> The training has a 60% chance of working</li><li><b>D.</b> The training has no effect on sales</li></ul></li>
<li><p>Sensor readings are taken every minute from 12 machines for a week. An analyst bootstraps the 120,000 readings to get an interval for the mean temperature and finds it extremely narrow. Why should it not be trusted?</p><ul><li><b>A.</b> A week of readings is too short a period for any bootstrap to work</li><li><b>B.</b> The bootstrap is valid only for normally distributed readings</li><li><b>C.</b> An interval can never be computed for a mean of sensor readings</li><li><b>D.</b> Readings of one machine are alike; the 12 machines are the units</li></ul></li>
<li><p>A league table ranks 50 branches by mean customer rating. The top three and the bottom three are all among the smallest branches. What is the most likely reason?</p><ul><li><b>A.</b> Small branches give either very good or very bad service</li><li><b>B.</b> Means of small groups vary more, so they reach both ends</li><li><b>C.</b> Customers of small branches rate more carelessly</li><li><b>D.</b> The ranking was computed with the wrong formula</li></ul></li>
<li><p>Two teams have mean resolution times with 95% intervals of 30 to 38 hours and 35 to 45 hours. An analyst must say whether the teams differ. What is the right next step?</p><ul><li><b>A.</b> Compute an interval for the difference between the two means</li><li><b>B.</b> State that they are equal, since the intervals overlap</li><li><b>C.</b> State that they differ, since the means are different</li><li><b>D.</b> Widen both intervals to 99% and compare them again</li></ul></li>
<li><p>A chart shows mean satisfaction by service channel with 95% bootstrap intervals. Which sentence belongs in its caption?</p><ul><li><b>A.</b> The intervals show that the survey is free of any bias</li><li><b>B.</b> The intervals cover sampling variation, not who chose to answer</li><li><b>C.</b> The intervals prove which channel customers really prefer</li><li><b>D.</b> The intervals contain 95% of all the customers' ratings</li></ul></li>
<li><p>An analyst tests 20 unrelated survey questions for a difference between two regions, each at the 0.05 level. In truth there is no difference on any of them. About how likely is at least one "significant" result?</p><ul><li><b>A.</b> About 5%</li><li><b>B.</b> About 20%</li><li><b>C.</b> About 64%</li><li><b>D.</b> About 95%</li></ul></li>
<li><p>Which of these findings is confirmed, in the sense used in this course?</p><ul><li><b>A.</b> The strongest of 30 correlations found in last year's sales data</li><li><b>B.</b> A result that three analysts each found plausible on inspection</li><li><b>C.</b> A pattern seen in January and seen again by rereading January's data</li><li><b>D.</b> A difference stated in the March plan and tested once on April's data</li></ul></li>
<li><p>While exploring, an analyst notices that customers who call on Mondays cancel more often. The pattern was one of many she looked at. What should her report say?</p><ul><li><b>A.</b> "Monday callers cancel more often (p = 0.03)", as a finding</li><li><b>B.</b> "Exploratory: one of many cuts; to be tested on next quarter's calls"</li><li><b>C.</b> Nothing: exploratory patterns do not belong in a report</li><li><b>D.</b> "Monday calls cause cancellations; move staff to Mondays"</li></ul></li>
<li><p>An analyst tries the mean, then the median, then the share above a threshold, and reports the one summary for which two groups differ "significantly". Why is the reported p-value too optimistic?</p><ul><li><b>A.</b> The median is never a valid summary for a test</li><li><b>B.</b> Three summaries were tried and the best one kept</li><li><b>C.</b> The groups should have been merged before testing</li><li><b>D.</b> A threshold always makes a difference look larger</li></ul></li>
<li><p>A report is rendered twice from the same data and code, and one interval reads 0.41 to 0.58 in the first run and 0.40 to 0.59 in the second. What is the most likely cause and its fix?</p><ul><li><b>A.</b> Resampling without a fixed seed; set the seed as a parameter</li><li><b>B.</b> Rounding differs between runs; print more decimals</li><li><b>C.</b> The data changed between runs; lock the file</li><li><b>D.</b> The two runs used different computers; use one computer</li></ul></li>
<li><p>A quarterly report reads its headline numbers from a file "summary.csv" that an analyst saved a year ago. Since then, duplicate rows were removed from the raw data. What is the risk?</p><ul><li><b>A.</b> The report will run more slowly than it needs to</li><li><b>B.</b> The headline numbers no longer follow from the raw data</li><li><b>C.</b> The summary file may be too large to send by e-mail</li><li><b>D.</b> The report will show more decimals than the raw data has</li></ul></li>
<li><p>A findings table has the columns finding, status, check and limit. Which row is complete and honest?</p><ul><li><b>A.</b> "Discounts cause loyalty" · confirmed · correlation 0.6 · none needed</li><li><b>B.</b> "Weekend orders are larger" · exploratory · best of 14 cuts · test next quarter</li><li><b>C.</b> "Sales rose in the north" · confirmed · looked at the chart · none</li><li><b>D.</b> "Returns fell" · exploratory · no check was run · the data may be wrong</li></ul></li>
<li><p>An exploratory report for a director who is not an analyst is being edited. Which sentence should stay as it is?</p><ul><li><b>A.</b> "The data proves that evening visitors are more satisfied than others."</li><li><b>B.</b> "In this data, evening visitors rated 0.3 point higher (0.1 to 0.5)."</li><li><b>C.</b> "Satisfaction is driven by the time of day at which people visit."</li><li><b>D.</b> "The difference between evening and daytime visitors is significant."</li></ul></li>
<li><p>What does it mean for a report to "rerun"?</p><ul><li><b>A.</b> One command rebuilds every number from the raw data</li><li><b>B.</b> It can be opened again without any software</li><li><b>C.</b> Its charts can be edited by hand after export</li><li><b>D.</b> It was reviewed twice before being sent out</li></ul></li>
</ol>
